<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#080c0f" />
    <meta name="description" content="VelohNav — AR bike-sharing app for Luxembourg Vel'OH!" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
    <title>VelohNav</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #080c0f; overflow: hidden; }
      @keyframes pulse {
        0%,100% { opacity:0.7; transform:translate(-50%,-50%) scale(1);   }
        50%      { opacity:1;   transform:translate(-50%,-50%) scale(1.12); }
      }
      @keyframes flagWave {
        0%,100% { transform:translateX(-50%) rotate(-4deg) scaleX(1);    }
        30%     { transform:translateX(-50%) rotate(2deg)  scaleX(0.97); }
        60%     { transform:translateX(-50%) rotate(-2deg) scaleX(1.02); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
