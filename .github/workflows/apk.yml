name: Build VelohNav APK

on:
  push:
    branches: [main]
    tags: ['v*']
  # workflow_dispatch avec entrée : la construction par défaut reste SANS moteur
  # natif ; l'entrée vhNative=1 demande la construction avec llama.cpp/Vulkan.
  workflow_dispatch:
    inputs:
      vhNative:
        description: "Moteur natif llama.cpp/Vulkan (-PvhNative=1) — APK ~59 Mo au lieu de ~51 Mo"
        required: false
        default: "0"
        type: string

# FIX: permissions explicites pour softprops/action-gh-release
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install JS dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      - name: Build web assets (Vite)
        env:
          # Sentry DSN — optionnel. Sans ce secret, Sentry reste désactivé.
          # Configurer dans Settings → Secrets and variables → Actions → VITE_SENTRY_DSN
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: velohnav@${{ github.sha }}
          # CRITIQUE : désactiver PWA pour build APK Capacitor
          # Le service worker entre en conflit avec le schéma capacitor:// /
          # https://localhost et cause un écran noir au boot dans le WebView.
          VITE_DISABLE_PWA: '1'
        run: npm run build

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Inject local.properties
        run: |
          set +x
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── Moteur natif llama.cpp/Vulkan — seulement si l'entrée vhNative=1 ──────
      # La construction par défaut (push main/tag, ou dispatch sans entrée) reste
      # strictement celle d'avant : aucun NDK à installer, drapeau vide.
      - name: Moteur natif demandé ?
        id: native
        run: |
          if [ "${{ inputs.vhNative }}" = "1" ] || [ "${{ inputs.vhNative }}" = "true" ]; then
            echo "flag=-PvhNative=1" >> "$GITHUB_OUTPUT"
            echo "Moteur natif ACTIF : -PvhNative=1 (llama.cpp + Vulkan, arm64-v8a)"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Construction par défaut, SANS moteur natif"
          fi

      # NDK 28.2.13676358 et CMake 3.31.6 : exigés par android/app/build.gradle quand
      # -PvhNative=1 est passé ; pas garantis dans l'image du runner, donc installés ici
      # (mêmes versions qu'en local). llama.cpp/Vulkan et SPIR-V sont téléchargés par
      # CMake lui-même, épinglés par URL et SHA-256.
      - name: NDK 28 + CMake 3.31 (moteur natif)
        if: steps.native.outputs.flag != ''
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
          ls -d "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/cmake/3.31.6"

      # Keystore de debug FIXE (optionnel). Sans lui, le runner en génère un neuf
      # à chaque exécution : le SHA-1 de l'APK debug change à chaque build et ne
      # peut pas être autorisé pour ARCore (voir docs/ARCORE.md).
      - name: Debug keystore stable (optionnel)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          else
            echo "DEBUG_KEYSTORE_BASE64 non configuré — keystore de debug éphémère"
          fi

      # Géométrie de l'AR ancrée au sol (GroundAnchorTest : JVM pur)
      - name: Native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon ${{ steps.native.outputs.flag }}

      - name: Build release APK (signé)
        id: release_build
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:    ${{ secrets.KEY_ALIAS }}
          KEY_PWD:      ${{ secrets.KEY_PASSWORD }}
          STORE_PWD:    ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_BASE64 non configuré — release ignorée"
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > app/velohnav-release.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/velohnav-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PWD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PWD" \
            --no-daemon ${{ steps.native.outputs.flag }}
          rm -f app/velohnav-release.jks
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VelohNav-AR-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: steps.release_build.outputs.signed == 'true'
        with:
          name: VelohNav-AR-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: APK size
        run: |
          set -u
          if [ -n "${{ steps.native.outputs.flag }}" ]; then
            echo "### Construction AVEC moteur natif (llama.cpp/Vulkan)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Construction SANS moteur natif (par défaut)" >> "$GITHUB_STEP_SUMMARY"
          fi
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            [ -f "$apk" ] || continue
            echo "=== $apk"
            echo -n "brut : "    && du -h "$apk" | cut -f1
            zip -9 -q -j "/tmp/$(basename "$apk").zip" "$apk"
            echo -n "zippé: "    && du -h "/tmp/$(basename "$apk").zip" | cut -f1
            echo "--- bibliothèques natives embarquées (les plus lourdes) ---"
            unzip -l "$apk" | awk '$4 ~ /\.so$/ {print $1, $4}' | sort -rn | head -6
            echo -n "moteur natif présent : "
            unzip -l "$apk" | grep -c "libvh_llm.so" || true
            echo "- $(basename "$apk") : $(du -h "$apk" | cut -f1) brut, $(du -h "/tmp/$(basename "$apk").zip" | cut -f1) zippé, libvh_llm.so ×$(unzip -l "$apk" | grep -c "libvh_llm.so")" >> "$GITHUB_STEP_SUMMARY"
          done

      # SHA-1 à déclarer dans la restriction de la clé ARCore (docs/ARCORE.md)
      - name: Empreintes SHA-1
        run: |
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            [ -f "$apk" ] && echo "=== $apk" && keytool -printcert -jarfile "$apk" | grep -E "SHA1|SHA-1" || true
          done

      # Attacher l'APK à la GitHub Release — uniquement sur tag v*
      # FIX 1: permissions contents:write en haut du fichier
      # FIX 2: release APK conditionnel (seulement si keystore configuré)
      # FIX 3: fail_on_unmatched_files: false pour ne pas crasher sans release APK
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
