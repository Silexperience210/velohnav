<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151821"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screen">
      <rect x="16" y="16" width="268" height="548" rx="22"/>
    </clipPath>
  </defs>
  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Phone 1: Map -->
  <g transform="translate(40, 20)" filter="url(#shadow)">
    <rect width="300" height="580" rx="28" fill="#050608" stroke="#2a2e3a" stroke-width="2"/>
    <rect x="16" y="16" width="268" height="548" rx="22" fill="#12141a" clip-path="url(#screen)"/>
    <g clip-path="url(#screen)">
      <rect width="268" height="548" fill="#151821"/>
      <path d="M0 50h268M0 90h268" stroke="rgba(255,255,255,.05)"/>
      <text x="134" y="38" fill="#f4f6fb" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui">VELOHNAV · Map</text>
      <text x="134" y="58" fill="#9aa3b2" font-size="10" text-anchor="middle" font-family="system-ui">GPS ±7 m · LIVE</text>
      <g transform="translate(40,110)">
        <rect width="188" height="220" rx="16" fill="rgba(34,211,238,.08)" stroke="rgba(255,255,255,.06)"/>
        <circle cx="94" cy="110" r="8" fill="none" stroke="#22d3ee" stroke-width="2"/>
        <circle cx="60" cy="80" r="5" fill="#34d399"/>
        <circle cx="130" cy="60" r="5" fill="#22d3ee"/>
        <circle cx="110" cy="150" r="5" fill="#fbbf24"/>
        <circle cx="50" cy="160" r="5" fill="#f87171"/>
      </g>
      <text x="134" y="410" fill="#9aa3b2" font-size="11" text-anchor="middle" font-family="system-ui">Live station availability</text>
      <rect x="20" y="440" width="228" height="44" rx="12" fill="#1a1d26"/>
      <text x="134" y="467" fill="#f4f6fb" font-size="12" text-anchor="middle" font-family="system-ui">116/143 stations available</text>
      <rect x="0" y="512" width="268" height="36" fill="#1a1d26"/>
      <text x="52" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">AR</text>
      <text x="108" y="535" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui">Map</text>
      <text x="162" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">AI</text>
      <text x="216" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">Settings</text>
    </g>
  </g>

  <!-- Phone 2: Assistant -->
  <g transform="translate(330, 20)" filter="url(#shadow)">
    <rect width="300" height="580" rx="28" fill="#050608" stroke="#2a2e3a" stroke-width="2"/>
    <rect x="16" y="16" width="268" height="548" rx="22" fill="#12141a" clip-path="url(#screen)"/>
    <g clip-path="url(#screen)">
      <rect width="268" height="548" fill="#12141a"/>
      <text x="134" y="38" fill="#f4f6fb" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui">VELOHNAV · Assistant</text>
      <text x="134" y="58" fill="#9aa3b2" font-size="10" text-anchor="middle" font-family="system-ui">LFM2.5 local · 30 tok/s</text>
      <rect x="18" y="80" width="180" rx="14" ry="14" fill="#1a1d26" stroke="rgba(255,255,255,.06)" height="54"/>
      <text x="28" y="104" fill="#f4f6fb" font-size="11" font-family="system-ui">Overcast, 9°C, wind 9 km/h</text>
      <text x="28" y="122" fill="#34d399" font-size="10" font-family="system-ui">Bike score 10/10</text>
      <rect x="70" y="150" width="180" rx="14" ry="14" fill="#222633" height="46"/>
      <text x="82" y="172" fill="#f4f6fb" font-size="11" font-family="system-ui">Which station is empty?</text>
      <rect x="18" y="210" width="180" rx="14" ry="14" fill="#1a1d26" stroke="rgba(255,255,255,.06)" height="40"/>
      <text x="28" y="234" fill="#f4f6fb" font-size="11" font-family="system-ui">EDELECK is empty — 12 docks.</text>
      <rect x="18" y="270" width="120" rx="12" ry="12" fill="#1a1d26" stroke="rgba(255,255,255,.06)" height="28"/>
      <text x="28" y="288" fill="#9aa3b2" font-size="10" font-family="system-ui">Nearest station?</text>
      <rect x="146" y="270" width="90" rx="12" ry="12" fill="#1a1d26" stroke="rgba(255,255,255,.06)" height="28"/>
      <text x="156" y="288" fill="#9aa3b2" font-size="10" font-family="system-ui">Weather</text>
      <rect x="0" y="512" width="268" height="36" fill="#1a1d26"/>
      <text x="52" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">AR</text>
      <text x="108" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">Map</text>
      <text x="162" y="535" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui">AI</text>
      <text x="216" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">Settings</text>
    </g>
  </g>

  <!-- Phone 3: AR -->
  <g transform="translate(620, 20)" filter="url(#shadow)">
    <rect width="300" height="580" rx="28" fill="#050608" stroke="#2a2e3a" stroke-width="2"/>
    <rect x="16" y="16" width="268" height="548" rx="22" fill="#12141a" clip-path="url(#screen)"/>
    <g clip-path="url(#screen)">
      <rect width="268" height="548" fill="#0f1116"/>
      <text x="134" y="38" fill="#f4f6fb" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui">VELOHNAV · AR</text>
      <text x="134" y="58" fill="#9aa3b2" font-size="10" text-anchor="middle" font-family="system-ui">AR active · LIVE</text>
      <g transform="translate(0,80)">
        <rect width="268" height="300" fill="url(#grid)" opacity=".3"/>
        <path d="M0 300 L268 300" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1"/>
        <path d="M40 300 L134 120 L228 300" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon points="134,120 124,145 144,145" fill="#22d3ee"/>
        <circle cx="134" cy="250" r="24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".6"/>
      </g>
      <rect x="54" y="360" width="160" height="30" rx="15" fill="rgba(0,0,0,.7)" stroke="#22d3ee"/>
      <text x="134" y="380" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui">Turn right · 120 m</text>
      <rect x="0" y="512" width="268" height="36" fill="#1a1d26"/>
      <text x="52" y="535" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui">AR</text>
      <text x="108" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">Map</text>
      <text x="162" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">AI</text>
      <text x="216" y="535" fill="#9aa3b2" font-size="9" text-anchor="middle" font-family="system-ui">Settings</text>
    </g>
  </g>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 L0 40" fill="none" stroke="#22d3ee" stroke-width=".5" stroke-opacity=".2"/>
  </pattern>
</svg>
